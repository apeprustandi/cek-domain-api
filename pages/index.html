<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Domain Keren</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.15), transparent 25%);
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 2.5rem;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 2rem;
        }

        input {
            flex: 1;
            padding: 1rem 1.25rem;
            font-size: 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        input::placeholder { color: var(--text-muted); }

        button {
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
        }

        button:disabled { background: #475569; cursor: not-allowed; transform: none; box-shadow: none; }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .results {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .domain-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border);
            padding: 1rem 1.25rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.4s ease forwards;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .domain-card:hover {
            background: rgba(30, 41, 59, 0.8);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        .domain-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .status-badge {
            font-weight: 700;
            color: var(--success);
            background: rgba(16, 185, 129, 0.1);
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            font-size: 0.85rem;
            box-shadow: inset 0 0 0 1px rgba(16, 185, 129, 0.2);
        }

        .status-message {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            padding: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cek Domain Keren</h1>
        <p class="subtitle">Temukan domain impian Anda dengan ekstensi populer</p>
        <div class="input-group">
            <input type="text" id="domainInput" placeholder="Masukkan nama (contoh: apeprustandi)" autocomplete="off">
            <button id="searchBtn">
                <span id="btnText">Cari</span>
                <div class="loader" id="loader"></div>
            </button>
        </div>
        <div class="results" id="resultsContainer"></div>
    </div>
    <script>
        const searchBtn = document.getElementById('searchBtn');
        const domainInput = document.getElementById('domainInput');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const resultsContainer = document.getElementById('resultsContainer');

        domainInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') performSearch();
        });

        searchBtn.addEventListener('click', performSearch);

        async function performSearch() {
            const base = domainInput.value.trim().toLowerCase();
            if (!base) return alert('Nama domain tidak boleh kosong!');
            
            const cleanBase = base.split('.')[0];
            setLoadingState(true);
            resultsContainer.innerHTML = '';

            try {
                // Memanggil endpoint API di Hono /api/check
                const response = await fetch('/api/check?domain=' + encodeURIComponent(cleanBase));
                if (!response.ok) throw new Error('Network Error');
                
                const domains = await response.json();
                
                if (domains.length === 0) {
                    resultsContainer.innerHTML = '<div class="status-message">Semua ekstensi domain tidak tersedia atau tergolong premium :(</div>';
                    return;
                }

                domains.forEach((d, index) => {
                    const card = document.createElement('div');
                    card.className = 'domain-card';
                    card.style.animationDelay = (index * 0.08) + 's';

                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'domain-name';
                    nameDiv.textContent = d.domain;

                    const badgeDiv = document.createElement('div');
                    badgeDiv.className = 'status-badge';
                    badgeDiv.textContent = 'TERSEDIA';

                    card.appendChild(nameDiv);
                    card.appendChild(badgeDiv);
                    resultsContainer.appendChild(card);
                });
            } catch (error) {
                resultsContainer.innerHTML = '<div class="status-message" style="color: var(--danger)">Gagal terhubung ke API.</div>';
            } finally {
                setLoadingState(false);
            }
        }

        function setLoadingState(isLoading) {
            searchBtn.disabled = isLoading;
            btnText.style.display = isLoading ? 'none' : 'block';
            loader.style.display = isLoading ? 'block' : 'none';
        }
    </script>
</body>
</html>
